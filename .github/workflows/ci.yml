name: CI

# Corre en cada push y en cada pull request.
on:
  push:
  pull_request:

jobs:
  # El nombre del job ("test") es el que se marca como check obligatorio en la protección de main.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11 (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias y el paquete
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        # pytest sale con código 5 cuando no encuentra tests. Mientras el repo no tenga
        # ninguno, eso no debe romper la CI: se acepta el 5 y se falla con cualquier otro código.
        # TODO: reemplazar por `pytest -q` cuando entre el primer test.
        run: pytest -q || [ $? -eq 5 ]
